<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Footwork That's Taking Over</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    h1 span {
      color: #e0ff4f;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #1a1a1a;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #video-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video-overlay .play-icon {
      width: 64px;
      height: 64px;
      fill: rgba(255, 255, 255, 0.85);
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
      transition: opacity 0.2s;
      pointer-events: none;
    }

    #video-overlay.playing .play-icon {
      opacity: 0;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-label {
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 420px) {
      .form-row {
        flex-direction: row;
      }
    }

    input[type="email"] {
      flex: 1;
      padding: 14px 16px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="email"]::placeholder {
      color: #555;
    }

    input[type="email"]:focus {
      border-color: #e0ff4f;
    }

    button[type="submit"] {
      padding: 14px 22px;
      background: #e0ff4f;
      color: #0d0d0d;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover {
      opacity: 0.9;
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    .success-msg {
      display: none;
      font-size: 0.95rem;
      color: #e0ff4f;
      padding: 12px 0 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>The Footwork That's Taking Over — <span>Watch &amp; Learn Free</span></h1>

    <div class="video-wrapper">
      <div id="video-overlay">
        <svg class="play-icon" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <circle cx="40" cy="40" r="40" fill="rgba(0,0,0,0.45)"/>
          <polygon points="32,22 62,40 32,58" fill="rgba(255,255,255,0.9)"/>
        </svg>
      </div>
      <iframe
        id="yt-player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        title="Footwork Tutorial"
      ></iframe>
    </div>

    <div class="form-section">
      <p class="form-label">Get the full breakdown</p>
      <form id="opt-in-form" novalidate>
        <div class="form-row">
          <input
            type="email"
            id="email-input"
            placeholder="your@email.com"
            autocomplete="email"
            required
          />
          <button type="submit">Get the Free Tutorial</button>
        </div>
        <p class="success-msg" id="success-msg">You're in! Check your inbox soon.</p>
      </form>
    </div>
  </div>

  <script>
    // ── Swap this URL to change the video ──────────────────────────────────
    const YOUTUBE_URL = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
    // ───────────────────────────────────────────────────────────────────────

    function extractVideoId(url) {
      try {
        const u = new URL(url);
        if (u.hostname === 'youtu.be') return u.pathname.slice(1);
        return u.searchParams.get('v');
      } catch {
        return null;
      }
    }

    let player;
    const overlay = document.getElementById('video-overlay');

    window.onYouTubeIframeAPIReady = function () {
      const videoId = extractVideoId(YOUTUBE_URL);
      if (!videoId) return;

      player = new YT.Player('yt-player', {
        videoId: videoId,
        playerVars: {
          playsinline: 1,
          rel: 0,
          fs: 0,
          modestbranding: 1,
          iv_load_policy: 3,
          enablejsapi: 1,
        },
        events: {
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.PLAYING) {
              overlay.classList.add('playing');
            } else {
              overlay.classList.remove('playing');
            }
          },
        },
      });
    };

    overlay.addEventListener('click', function () {
      if (!player) return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    document.getElementById('opt-in-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const emailInput = document.getElementById('email-input');
      const successMsg = document.getElementById('success-msg');

      if (!emailInput.validity.valid || !emailInput.value.trim()) {
        emailInput.focus();
        return;
      }

      // Replace this block with your actual form submission / API call
      console.log('Email submitted:', emailInput.value.trim());

      emailInput.value = '';
      emailInput.disabled = true;
      document.querySelector('button[type="submit"]').disabled = true;
      successMsg.style.display = 'block';
    });
  </script>
</body>
</html>
