<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Footwork That's Taking Over</title>
  <style>
    :root {
      --accent: #e0ff4f;
      --bg: #0d0d0d;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    h1 span { color: var(--accent); }

    /* ── Video ── */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #1a1a1a;
    }

    .video-wrapper iframe,
    #yt-player { width: 100%; height: 100%; border: none; display: block; }

    #video-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      transition: background 0.25s;
    }

    #video-overlay.playing { background: transparent; }

    #video-overlay .play-icon {
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
      transition: opacity 0.2s;
      pointer-events: none;
    }

    #video-overlay.playing .play-icon { opacity: 0; }

    .mute-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.55);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 16px;
      line-height: 1;
      transition: background 0.2s;
    }

    .mute-btn:hover { background: rgba(0,0,0,0.75); }

    /* ── Flow sections ── */
    .hidden { display: none !important; }

    /* CTA button */
    .cta-btn {
      width: 100%;
      padding: 16px 22px;
      background: var(--accent);
      color: var(--bg);
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .cta-btn:hover { opacity: 0.9; }
    .cta-btn:active { transform: scale(0.98); }

    /* Email form section */
    .form-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-label {
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 420px) {
      .form-row { flex-direction: row; }
    }

    input[type="email"] {
      flex: 1;
      padding: 14px 16px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="email"]::placeholder { color: #555; }
    input[type="email"]:focus { border-color: var(--accent); }

    button[type="submit"] {
      padding: 14px 22px;
      background: var(--accent);
      color: var(--bg);
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:active { transform: scale(0.98); }

    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding-top: 10px;
    }

    .consent-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-top: 2px;
      accent-color: #000000;
      cursor: pointer;
    }

    .consent-row label {
      font-size: 0.82rem;
      color: #888;
      line-height: 1.4;
      cursor: pointer;
    }

    .consent-row label a {
      color: #aaa;
      text-decoration: underline;
    }

    .consent-error {
      display: none;
      font-size: 0.82rem;
      color: #ff4f4f;
      padding-top: 6px;
    }

    /* Survey section */
    .survey-progress {
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .survey-question {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 20px;
    }

    .survey-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .survey-opt-btn {
      width: 100%;
      padding: 14px 16px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .survey-opt-btn:hover {
      border-color: var(--accent);
      background: #222;
    }

    /* Done section */
    .done-msg {
      font-size: 1rem;
      color: var(--accent);
      text-align: center;
      padding: 12px 0;
    }

    footer {
      width: 100%;
      max-width: 640px;
      text-align: center;
      padding: 24px 0 0;
      font-size: 0.75rem;
      color: #444;
    }

    footer a { color: #666; text-decoration: none; letter-spacing: 0.05em; }
    footer a:hover { color: #888; }
  </style>

  <script>
    (async function () {
      try {
        const cfg = await fetch('/api/config').then(function (r) { return r.json(); });
        if (!cfg.projectId) return;
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        const { getFirestore, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
        const db = getFirestore(initializeApp(cfg));
        window.__fsPageDoc = doc(db, 'settings', 'page');
        window.__fsGet     = getDoc;
        window.dispatchEvent(new Event('firebase-ready'));
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="container">
    <h1>The Footwork That's Taking Over — <span>Watch &amp; Learn Free</span></h1>

    <div class="video-wrapper">
      <div id="video-overlay">
        <svg class="play-icon" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <circle cx="40" cy="40" r="40" fill="rgba(0,0,0,0.45)"/>
          <polygon points="32,22 62,40 32,58" fill="rgba(255,255,255,0.9)"/>
        </svg>
        <button class="mute-btn" id="mute-btn" title="Toggle sound">🔇</button>
      </div>
      <div id="yt-player"></div>
    </div>

    <!-- Step 1: CTA button (micro-commitment) -->
    <div id="cta-section">
      <button id="cta-btn" class="cta-btn">Get the Free Tutorial</button>
    </div>

    <!-- Step 2: Email form -->
    <div id="form-section" class="form-section hidden">
      <p class="form-label" id="form-label">Get the full breakdown</p>
      <form id="opt-in-form" novalidate>
        <div class="form-row">
          <input
            type="email"
            id="email-input"
            placeholder="your@email.com"
            autocomplete="email"
            required
          />
          <button type="submit">Submit →</button>
        </div>
        <div class="consent-row">
          <input type="checkbox" id="consent" required />
          <label for="consent" id="consent-label">I agree to receive marketing emails. You can unsubscribe at any time.</label>
        </div>
        <p class="consent-error" id="consent-error">Please tick the box above to continue.</p>
      </form>
    </div>

    <!-- Step 3: Survey -->
    <div id="survey-section" class="hidden">
      <p id="survey-progress" class="survey-progress"></p>
      <p id="survey-question" class="survey-question"></p>
      <div id="survey-options" class="survey-options"></div>
    </div>

    <!-- Step 4: Done -->
    <div id="done-section" class="hidden">
      <p class="done-msg" id="done-msg">You're in! We'll be in touch soon.</p>
    </div>
  </div>

  <footer>Made with <a href="login.html">SRTXRP</a></footer>

  <script>
    // ── Apply colors from localStorage (instant, before paint) ─────────────
    const _accent = localStorage.getItem('srtxrp_accent');
    const _bg     = localStorage.getItem('srtxrp_bg');
    if (_accent) document.documentElement.style.setProperty('--accent', _accent);
    if (_bg)     document.documentElement.style.setProperty('--bg', _bg);

    // ── YouTube URL ────────────────────────────────────────────────────────
    let YOUTUBE_URL = localStorage.getItem('srtxrp_video_url') || 'https://youtu.be/ujREEgxEP7g?si=F3UU05KWRFMc85yM';
    // ───────────────────────────────────────────────────────────────────────

    function postToSheets(data) {
      fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      }).catch(function () {});
    }

    function applyHeadline(text) {
      const i = text.indexOf(' — ');
      document.querySelector('h1').innerHTML = i >= 0
        ? text.slice(0, i) + ' — <span>' + text.slice(i + 3) + '</span>'
        : text;
    }

    function applyPolicySettings() {
      const consentText  = localStorage.getItem('srtxrp_consent_text') || 'I agree to receive marketing emails. You can unsubscribe at any time.';
      const privacyUrl   = localStorage.getItem('srtxrp_privacy_url')   || '';
      const privacyLabel = localStorage.getItem('srtxrp_privacy_label') || 'Privacy Policy';
      const tosUrl       = localStorage.getItem('srtxrp_tos_url')        || '';
      const tosLabel     = localStorage.getItem('srtxrp_tos_label')      || 'Terms of Service';

      const label = document.getElementById('consent-label');
      const frag  = document.createDocumentFragment();

      frag.appendChild(document.createTextNode(consentText));

      const links = [];
      if (privacyUrl) {
        const a = document.createElement('a');
        a.href = privacyUrl; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = privacyLabel;
        links.push(a);
      }
      if (tosUrl) {
        const a = document.createElement('a');
        a.href = tosUrl; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = tosLabel;
        links.push(a);
      }

      if (links.length) {
        frag.appendChild(document.createTextNode(' '));
        links.forEach(function (a, i) {
          if (i > 0) frag.appendChild(document.createTextNode(' · '));
          frag.appendChild(a);
        });
      }

      label.textContent = '';
      label.appendChild(frag);
    }

    // Apply content overrides from localStorage
    (function () {
      const h = localStorage.getItem('srtxrp_headline');
      if (h) applyHeadline(h);
      const b = localStorage.getItem('srtxrp_btn_text');
      if (b) document.getElementById('cta-btn').textContent = b;
      const l = localStorage.getItem('srtxrp_label');
      if (l) document.getElementById('form-label').textContent = l;
      const d = localStorage.getItem('srtxrp_done_msg');
      if (d) document.getElementById('done-msg').textContent = d;
      applyPolicySettings();
    })();

    // ── Survey ─────────────────────────────────────────────────────────────
    const DEFAULT_STEPS = [
      { question: "What's your current level?",
        options: ['Complete beginner', 'Some experience', 'Already decent'] },
      { question: "What's your goal?",
        options: ['Learn the basics', 'Improve my footwork', 'Perform with confidence'] },
    ];

    let surveySteps = DEFAULT_STEPS;
    try {
      const stored = localStorage.getItem('srtxrp_workflow');
      if (stored) surveySteps = JSON.parse(stored);
    } catch (e) {}

    let surveyIndex   = 0;
    let surveyAnswers = [];
    let submittedEmail = '';

    document.getElementById('cta-btn').addEventListener('click', function () {
      document.getElementById('cta-section').classList.add('hidden');
      document.getElementById('form-section').classList.remove('hidden');
    });

    function showSurvey() {
      document.getElementById('form-section').classList.add('hidden');
      if (!surveySteps.length) {
        document.getElementById('done-section').classList.remove('hidden');
        return;
      }
      surveyIndex   = 0;
      surveyAnswers = [];
      renderSurveyStep();
      document.getElementById('survey-section').classList.remove('hidden');
    }

    function renderSurveyStep() {
      const step = surveySteps[surveyIndex];
      document.getElementById('survey-progress').textContent =
        'Step ' + (surveyIndex + 1) + ' of ' + surveySteps.length;
      document.getElementById('survey-question').textContent = step.question;

      const container = document.getElementById('survey-options');
      container.innerHTML = '';

      step.options.forEach(function (opt) {
        const btn = document.createElement('button');
        btn.className = 'survey-opt-btn';
        btn.type      = 'button';
        btn.textContent = opt;
        btn.addEventListener('click', function () {
          surveyAnswers.push(opt);
          surveyIndex++;
          if (surveyIndex < surveySteps.length) {
            renderSurveyStep();
          } else {
            document.getElementById('survey-section').classList.add('hidden');
            document.getElementById('done-section').classList.remove('hidden');
            postToSheets({
              type: 'survey',
              email: submittedEmail,
              answers: surveyAnswers,
              timestamp: new Date().toISOString(),
            });
          }
        });
        container.appendChild(btn);
      });
    }
    // ───────────────────────────────────────────────────────────────────────

    document.getElementById('opt-in-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const emailInput   = document.getElementById('email-input');
      const consent      = document.getElementById('consent');
      const consentError = document.getElementById('consent-error');

      if (!emailInput.validity.valid || !emailInput.value.trim()) {
        emailInput.focus();
        return;
      }
      if (!consent.checked) {
        consentError.style.display = 'block';
        consent.focus();
        return;
      }
      consentError.style.display = 'none';

      submittedEmail = emailInput.value.trim();
      postToSheets({ type: 'email', email: submittedEmail, timestamp: new Date().toISOString() });
      showSurvey();
    });

    // ── YouTube player ──────────────────────────────────────────────────────
    function extractVideoId(url) {
      try {
        const u = new URL(url);
        if (u.hostname === 'youtu.be') return u.pathname.slice(1).split('?')[0];
        return u.searchParams.get('v');
      } catch { return null; }
    }

    let player;
    const overlay = document.getElementById('video-overlay');

    window.onYouTubeIframeAPIReady = function () {
      const videoId = extractVideoId(YOUTUBE_URL);
      if (!videoId) return;
      player = new YT.Player('yt-player', {
        width: '100%', height: '100%',
        videoId: videoId,
        playerVars: { playsinline: 1, rel: 0, fs: 0, modestbranding: 1, iv_load_policy: 3, enablejsapi: 1, controls: 0, autoplay: 1, mute: 1, disablekb: 1 },
        events: {
          onStateChange: function (e) {
            overlay.classList.toggle('playing', e.data === YT.PlayerState.PLAYING);
          },
          onReady: function () { player.playVideo(); },
        },
      });
    };

    overlay.addEventListener('click', function () {
      if (!player) return;
      player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
    });

    const muteBtn = document.getElementById('mute-btn');
    let muted = true;
    muteBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!player) return;
      muted = !muted;
      muted ? player.mute() : player.unMute();
      muteBtn.textContent = muted ? '🔇' : '🔊';
    });

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    // ───────────────────────────────────────────────────────────────────────

    // ── Firestore sync ─────────────────────────────────────────────────────
    window.addEventListener('firebase-ready', async function () {
      try {
        const snap = await window.__fsGet(window.__fsPageDoc);
        if (!snap.exists()) return;
        const d = snap.data();
        if (d.accent)   { document.documentElement.style.setProperty('--accent', d.accent);  localStorage.setItem('srtxrp_accent', d.accent); }
        if (d.bg)       { document.documentElement.style.setProperty('--bg', d.bg);           localStorage.setItem('srtxrp_bg', d.bg); }
        if (d.headline) { applyHeadline(d.headline);                                           localStorage.setItem('srtxrp_headline', d.headline); }
        if (d.btnText)  { document.getElementById('cta-btn').textContent = d.btnText;          localStorage.setItem('srtxrp_btn_text', d.btnText); }
        if (d.label)    { document.getElementById('form-label').textContent = d.label;         localStorage.setItem('srtxrp_label', d.label); }
        if (d.videoUrl) {
          localStorage.setItem('srtxrp_video_url', d.videoUrl);
          const id = extractVideoId(d.videoUrl);
          if (id && player && d.videoUrl !== YOUTUBE_URL) player.loadVideoById(id);
          YOUTUBE_URL = d.videoUrl;
        }
      } catch (e) {}
    });
    // ───────────────────────────────────────────────────────────────────────
  </script>
</body>
</html>
