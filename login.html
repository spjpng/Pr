<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRTXRP — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #e0ff4f;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
    }

    .fields { display: flex; flex-direction: column; gap: 16px; }

    .field { display: flex; flex-direction: column; gap: 8px; }

    label {
      font-size: 0.8rem;
      color: #888;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus { border-color: #e0ff4f; }

    button {
      width: 100%;
      padding: 14px;
      background: #e0ff4f;
      color: #0d0d0d;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: default; }

    .error-msg {
      display: none;
      font-size: 0.85rem;
      color: #ff4f4f;
      text-align: center;
    }
  </style>

  <!-- ── Firebase (optional) — paste your config to enable secure auth ──────── -->
  <script type="module">
    const firebaseConfig = {
      apiKey:            'PASTE_API_KEY',
      authDomain:        'PASTE_AUTH_DOMAIN',
      projectId:         'PASTE_PROJECT_ID',
      storageBucket:     'PASTE_STORAGE_BUCKET',
      messagingSenderId: 'PASTE_SENDER_ID',
      appId:             'PASTE_APP_ID',
    };

    if (firebaseConfig.projectId !== 'PASTE_PROJECT_ID') {
      (async () => {
        try {
          const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
          const { getAuth, signInWithEmailAndPassword, onAuthStateChanged } =
            await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
          const app  = initializeApp(firebaseConfig);
          const auth = getAuth(app);

          // Already signed in → skip login page
          onAuthStateChanged(auth, function (user) {
            if (user) window.location.replace('editor.html');
          });

          window.__firebaseAuth       = auth;
          window.__signIn             = signInWithEmailAndPassword;
          window.__firebaseConfigured = true;
          window.dispatchEvent(new Event('firebase-ready'));
        } catch (e) {}
      })();
    }
  </script>
  <!-- ────────────────────────────────────────────────────────────────────────── -->
</head>
<body>
  <div class="card">
    <p class="brand">SRTXRP</p>
    <h1>Sign In</h1>
    <form id="login-form" novalidate>
      <div class="fields">
        <div class="field" id="email-field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
      </div>
      <button type="submit" id="submit-btn" style="margin-top:20px;">Sign In</button>
      <p class="error-msg" id="error-msg" style="margin-top:12px;"></p>
    </form>
  </div>

  <script>
    // ── Fallback password (used only when Firebase is not configured) ────────
    const FALLBACK_PASSWORD = 'Ma$term1nd';
    // ─────────────────────────────────────────────────────────────────────────

    // Hide email field until Firebase is confirmed — fallback only needs password
    const emailField = document.getElementById('email-field');
    emailField.style.display = 'none';

    window.addEventListener('firebase-ready', function () {
      // Firebase is live — show email field for proper auth
      emailField.style.display = 'flex';
    });

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn      = document.getElementById('submit-btn');
      const errorMsg = document.getElementById('error-msg');

      errorMsg.style.display = 'none';
      btn.disabled = true;

      if (window.__firebaseConfigured) {
        // Firebase Auth path
        try {
          await window.__signIn(window.__firebaseAuth, email, password);
          window.location.replace('editor.html');
        } catch (err) {
          errorMsg.textContent = 'Incorrect email or password.';
          errorMsg.style.display = 'block';
          btn.disabled = false;
        }
      } else {
        // Fallback: hardcoded password (works locally before Firebase is set up)
        if (password === FALLBACK_PASSWORD) {
          localStorage.setItem('srtxrp_auth', '1');
          window.location.replace('editor.html');
        } else {
          errorMsg.textContent = 'Incorrect password.';
          errorMsg.style.display = 'block';
          btn.disabled = false;
        }
      }
    });

    // Fallback auth: already logged in locally
    if (!window.__firebaseConfigured && localStorage.getItem('srtxrp_auth') === '1') {
      window.location.replace('editor.html');
    }
  </script>
</body>
</html>
